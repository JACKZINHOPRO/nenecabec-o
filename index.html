<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o nenê cabeção</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* ===== TELA INICIAL ===== */

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  transition: opacity 1s ease;
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

.hero p {
  max-width: 400px;
  line-height: 1.6;
}

button {
  margin-top: 30px;
  padding: 12px 25px;
  border: none;
  border-radius: 6px;
  background: #e50914;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* ===== TRANSIÇÃO ===== */

.fade-out {
  opacity: 0;
}

/* ===== SEGUNDA TELA ===== */

.conteudo {
  display: none;
  opacity: 0;
  transition: opacity 1.5s ease;
  text-align: center;
  padding: 40px 20px;
}

.conteudo.mostrar {
  display: block;
  opacity: 1;
}

/* Escolhas */

.escolha button {
  margin: 15px;
  background: white;
  color: black;
}

.galeria {
  margin-top: 40px;
}

.galeria img {
  width: 90%;
  max-width: 350px;
  border-radius: 15px;
  margin: 20px 0;
}

</style>
</head>

<body>

<div class="hero" id="hero">
  <h1>Para o nenê cabeção</h1>
  <p>
    Eu poderia começar esse site de mil formas diferentes…<br><br>
    Mas a verdade é simples:<br><br>
    É sobre você.
  </p>
  <button onclick="entrar()">Começar</button>
</div>

<div class="conteudo" id="conteudo">

  <h2>Escolha com cuidado…</h2>

  <div class="escolha">
    <button onclick="mostrarFotos('zuadas')">Fotos zoadas</button>
    <button onclick="mostrarFotos('gosto')">Fotos que eu mais gosto</button>
  </div>

  <div class="galeria" id="galeria"></div>

</div>

<script>

function entrar() {
  const hero = document.getElementById("hero");
  hero.classList.add("fade-out");

  setTimeout(() => {
    hero.style.display = "none";
    const conteudo = document.getElementById("conteudo");
    conteudo.classList.add("mostrar");
  }, 1000);
}

function mostrarFotos(tipo) {
  const galeria = document.getElementById("galeria");

  if (tipo === "zuadas") {
    galeria.innerHTML = `
      <img src="zoada1.jpg">
      <img src="zoada2.jpg">
    `;
  } else {
    galeria.innerHTML = `
      <img src="foto1.jpg">
      <img src="foto2.jpg">
      <img src="foto3.jpg">
    `;
  }
}

</script>

</body>
</html>
