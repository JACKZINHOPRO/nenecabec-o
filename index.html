<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o nenê cabeção</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: black;
  color: white;
  transition: 0.5s;
}

h1 {
  margin-top: 40px;
}

.botoes {
  margin: 20px;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.roxo {
  background: purple;
  color: white;
}

.rosa {
  background: hotpink;
  color: white;
}

/* TEMA ROXO */
.tema-roxo {
  background: linear-gradient(180deg, #1a001a, #4b0082);
}

/* TEMA ROSA */
.tema-rosa {
  background: linear-gradient(180deg, black, hotpink);
}

.secao {
  position: relative;
  margin: 40px 0;
}

.secao img {
  width: 90%;
  max-width: 400px;
  border-radius: 15px;
}

.palavra {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 35px;
  font-weight: bold;
}

.texto-final {
  margin: 40px;
  font-size: 20px;
}

</style>
</head>

<body>

<h1>Se a gente fosse um casal de desenho…</h1>

<div class="botoes">
  <button class="roxo" onclick="temaRoxo()">Mutano & Ravena</button>
  <button class="rosa" onclick="temaRosa()">Robin & Estelar</button>
</div>

<h2>Para o nenê cabeção</h2>

<div class="secao">
  <img src="foto1.jpg">
  <div class="palavra">Linda</div>
</div>

<div class="secao">
  <img src="foto2.jpg">
  <div class="palavra">Incrível</div>
</div>

<div class="secao">
  <img src="foto3.jpg">
  <div class="palavra">Minha</div>
</div>

<div class="secao">
  <img src="eu-crianca.jpg">
</div>

<div class="texto-final">
  Eu nunca vou te deixar.<br><br>
  Sabe por quê?<br><br>
  Era o sonho desse garotinho ter uma princesa como você.
</div>

<h2>Eu te amo.</h2>

<script>
function temaRoxo() {
  document.body.classList.remove("tema-rosa");
  document.body.classList.add("tema-roxo");
}

function temaRosa() {
  document.body.classList.remove("tema-roxo");
  document.body.classList.add("tema-rosa");
}
</script>

</body>
</html>
