<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Para o nenê cabeção</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ENTRADA -->
<section id="entrada" class="tela ativa">
  <h1>Para o nenê cabeção</h1>
  <p>Eu poderia começar esse site de mil formas diferentes…</p>
  <p>Mas a verdade é simples:</p>
  <h2>É sobre você.</h2>
  <button onclick="irParaEscolha()">Entrar</button>
</section>

<!-- ESCOLHA -->
<section id="escolha" class="tela">
  <h2>Escolha com cuidado...</h2>

  <div class="botoes">
    <button onclick="mostrarZuadas()">Fotos zuadas</button>
    <button onclick="mostrarFavoritas()">Fotos que eu gosto</button>
  </div>

  <div id="conteudo"></div>
</section>

<!-- FINAL -->
<section id="final" class="tela">
  <h2>Eu nunca vou te deixar.</h2>
  <p>sabe porque?</p>

  <img src="eu-crianca.jpg" class="crianca">

  <p class="frase-final">
  Era o sonho desse garotinho ter uma princesa como você.
  </p>
</section>

<script>

function irParaEscolha() {
  trocarTela("entrada","escolha");
}

function mostrarZuadas() {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = `
    <h3>Você não tem fotos zuadas. Só perfeitas.</h3>
    <div class="galeria">
      <img src="1.jpg">
      <img src="2.jpg">
      <img src="3.jpg">
    </div>
    <button onclick="irParaFinal()">Continuar</button>
  `;
}

function mostrarFavoritas() {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = `
    <h3>Essas são as que eu mais gosto.</h3>
    <div class="galeria">
      <img src="4.jpg">
      <img src="5.jpg">
      <img src="6.jpg">
    </div>
    <button onclick="irParaFinal()">Continuar</button>
  `;
}

function irParaFinal() {
  trocarTela("escolha","final");
}

function trocarTela(atual,proxima){
  document.getElementById(atual).classList.remove("ativa");
  document.getElementById(proxima).classList.add("ativa");
}

</script>

</body>
</html>
